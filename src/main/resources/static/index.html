
<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>TaskFlow</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #eef2f8;
            color: #17243c;
            font: 16px system-ui, sans-serif;
        }

        header {
            background: #14243d;
            color: white;
            padding: 36px max(5%, calc((100% - 760px)/2));
        }

        header h1 {
            margin: 0;
            font-size: 38px;
        }

        header p {
            color: #b9cce8;
        }

        main {
            max-width: 760px;
            margin: 24px auto;
            padding: 16px;
        }

        .stats {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }

        .stats div {
            flex: 1;
            background: white;
            border-radius: 12px;
            padding: 18px;
        }

        .stats strong {
            display: block;
            font-size: 28px;
            color: #2563eb;
        }

        section {
            background: white;
            padding: 22px;
            border-radius: 14px;
        }

        form, li {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        input {
            flex: 1;
            min-width: 0;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
        }

        button {
            border: 0;
            border-radius: 8px;
            padding: 10px 14px;
            background: #2563eb;
            color: white;
            cursor: pointer;
        }

        ul {
            padding: 0;
        }

        li {
            padding: 14px 0;
            border-bottom: 1px solid #e2e8f0;
        }

        li span {
            flex: 1;
            overflow-wrap: anywhere;
        }

        .done {
            text-decoration: line-through;
            color: #64748b;
        }

        .delete {
            background: #fee2e2;
            color: #991b1b;
        }

        footer {
            text-align: center;
            color: #64748b;
            padding: 20px;
        }

        #error {
            color: #b91c1c;
        }
    </style>
</head>

<body>

    <header>
        <h1>TaskFlow</h1>
        <p>Java Spring Boot · Automated CI/CD on AWS EKS</p>
    </header>

    <main>

        <div class="stats">
            <div>
                Total
                <strong id="total">0</strong>
            </div>

            <div>
                Pending
                <strong id="pending">0</strong>
            </div>

            <div>
                Completed
                <strong id="completed">0</strong>
            </div>
        </div>

        <section>
            <h2>My tasks</h2>

            <form id="form">
                <input
                    id="title"
                    required
                    maxlength="200"
                    placeholder="Enter a new task"
                    aria-label="Task title"
                >
                <button>Add task</button>
            </form>

            <p id="error" role="alert"></p>

            <ul id="tasks"></ul>
        </section>

    </main>

    <footer>
        TaskFlow v2.0 · Automated CI/CD Deployment Successful
    </footer>

    <script>
        const $ = id => document.getElementById(id);

        async function api(path = '', options = {}) {
            const r = await fetch('/api/tasks' + path, options);

            if (!r.ok) {
                throw Error('Request failed: ' + r.status);
            }

            return r.status === 204 ? null : r.json();
        }

        async function run(fn) {
            try {
                $('error').textContent = '';
                await fn();
            } catch (e) {
                $('error').textContent = e.message;
            }
        }

        async function load() {
            const tasks = await api();

            $('total').textContent = tasks.length;

            $('completed').textContent =
                tasks.filter(t => t.completed).length;

            $('pending').textContent =
                tasks.filter(t => !t.completed).length;

            $('tasks').replaceChildren();

            for (const t of tasks) {
                const li = document.createElement('li');
                const span = document.createElement('span');
                const toggle = document.createElement('button');
                const del = document.createElement('button');

                span.textContent = t.title;

                if (t.completed) {
                    span.className = 'done';
                }

                toggle.textContent =
                    t.completed ? 'Undo' : 'Complete';

                toggle.onclick = () => run(async () => {
                    await api('/' + t.id, {
                        method: 'PUT'
                    });

                    await load();
                });

                del.textContent = 'Delete';
                del.className = 'delete';

                del.onclick = () => run(async () => {
                    await api('/' + t.id, {
                        method: 'DELETE'
                    });

                    await load();
                });

                li.append(span, toggle, del);
                $('tasks').append(li);
            }

            if (!tasks.length) {
                $('tasks').textContent = 'No tasks yet.';
            }
        }

        $('form').onsubmit = e => {
            e.preventDefault();

            run(async () => {
                await api('', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        title: $('title').value
                    })
                });

                $('title').value = '';

                await load();
            });
        };

        run(load);
    </script>

</body>
</html>
